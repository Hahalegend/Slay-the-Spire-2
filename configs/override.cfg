[application]
run/max_fps=60
run/flush_stdout_on_print=false

[debug]
settings/gdscript/always_track_call_stacks=false

[physics]
common/physics_ticks_per_second=30
common/max_physics_steps_per_frame=2

[display]
window/frame_pacing/android/enable_frame_pacing=false
window/vsync/vsync_mode=0

[rendering]
anti_aliasing/quality/msaa_2d=0
anti_aliasing/quality/msaa_3d=0
anti_aliasing/quality/screen_space_aa=0
anti_aliasing/screen_space_roughness_limiter/enabled=false
viewport/hdr_2d=false
2d/shadow_atlas/size=256
2d/batching/item_buffer_size=32768
2d/batching/uniform_set_cache_size=256
lights_and_shadows/directional_shadow/size=256
lights_and_shadows/positional_shadow/atlas_size=256
textures/default_filters/anisotropic_filtering_level=0
textures/default_filters/use_nearest_mipmap_filter=true
environment/glow/upscale_mode=0
rendering_device/vsync/swapchain_image_count=3
rendering_device/vsync/frame_queue_size=2
rendering_device/pipeline_cache/enable=true
rendering_device/pipeline_cache/save_chunk_size_mb=1
shader_compiler/shader_cache/enabled=true
shader_compiler/shader_cache/compress=false
shader_compiler/shader_cache/use_zstd_compression=false
